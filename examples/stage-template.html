<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LensUI stage</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: 240 7% 3%;
      --foreground: 210 22% 96%;
      --card: 220 13% 10%;
      --card-foreground: 210 22% 96%;
      --primary: 193 100% 68%;
      --primary-foreground: 220 18% 7%;
      --secondary: 220 11% 13%;
      --secondary-foreground: 210 22% 94%;
      --muted: 220 11% 12%;
      --muted-foreground: 215 11% 68%;
      --accent: 218 14% 17%;
      --accent-foreground: 210 22% 96%;
      --destructive: 0 100% 71%;
      --destructive-foreground: 0 0% 98%;
      --border: 215 13% 19%;
      --input: 215 13% 19%;
      --ring: 193 100% 68%;
      --success: 151 74% 66%;
      --warning: 40 90% 69%;
      --surface-raised: 220 12% 13%;
      --radius: 0.5rem;
      --lens-stage-padding: clamp(16px, 3vw, 32px);
      --lens-panel-background: linear-gradient(180deg, rgb(255 255 255 / 0.035), transparent 42%), hsl(var(--card) / 0.92);
      --lens-panel-border: hsl(var(--border) / 0.82);
      --lens-shadow: 0 18px 60px rgb(0 0 0 / 0.24);
      --lens-font-body: Manrope, Avenir Next, -apple-system, BlinkMacSystemFont, sans-serif;
      --lens-font-display: Space Grotesk, Manrope, -apple-system, BlinkMacSystemFont, sans-serif;
      --lens-font-mono: JetBrains Mono, SF Mono, ui-monospace, monospace;
    }

    html,
    body,
    #lens-stage-mount {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--lens-font-body);
    }

    * {
      box-sizing: border-box;
      min-width: 0;
      letter-spacing: 0;
    }

    .lens-stage-root {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: contain;
      padding: var(--lens-stage-padding);
      background: hsl(var(--background));
    }

    #lens-stage-frame {
      display: flex;
      min-height: 100%;
      width: 100%;
      max-width: 64rem;
      flex-direction: column;
      justify-content: center;
      gap: 1.25rem;
      margin: 0 auto;
      transform-origin: top center;
    }

    .lens-stage-frame p,
    .lens-stage-frame h1,
    .lens-stage-frame h2,
    .lens-stage-frame h3,
    .lens-stage-frame h4,
    .lens-stage-frame td,
    .lens-stage-frame th {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="lens-stage-mount"></div>
  <script src="../dist/lensui.stage.global.js"></script>
</body>
</html>
